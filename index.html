<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>velm</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F8F5EE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    // Service Worker — wymagany dla TWA / Play Store
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          reg.update().catch(() => {});
        }).catch(() => {});
      });

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!window.__velmSwReloaded) {
          window.__velmSwReloaded = true;
          window.location.reload();
        }
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <script>
    // Force light mode on Samsung WebView and all Android browsers
    (function(){
      var s = document.documentElement.style;
      s.setProperty('background-color','#F8F5EE','important');
      s.setProperty('color','#0F1F3D','important');
      s.setProperty('color-scheme','light','important');
      document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
</head>
<body data-theme="default" style="background:#F8F5EE!important;color:var(--navy)" onload="forceLight()">

<div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>

<div id="app"></div>
<div class="ctaf" id="ctaf" style="display:none"><div class="ctai"><button class="btn-p" id="ctab" onclick="next()">Continue</button></div></div>
