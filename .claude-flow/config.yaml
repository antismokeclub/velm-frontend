# RuFlo V3 Runtime Configuration — velm project
# Generated: 2026-04-06

version: "3.0.0"

# ── PROJECT CONTEXT ──────────────────────────────────────────
project:
  name: "velm"
  description: "AI-powered running coach — PWA with 4 AI agents"
  paths:
    backend: "velm-backend"
    frontend: "dashboard.html"
    onboarding: "index.html"
  stack:
    runtime: "node.js"
    framework: "express"
    database: "supabase"
    ai: "anthropic-claude"
    frontend: "vanilla-html-css-js"

# ── SWARM ────────────────────────────────────────────────────
swarm:
  topology: hierarchical
  maxAgents: 8
  autoScale: false
  coordinationStrategy: specialized
  # Velm swarm: planner → backend + frontend → tester
  defaultTeam:
    - velm-planner
    - velm-backend
    - velm-frontend
    - velm-tester

# ── MEMORY ───────────────────────────────────────────────────
memory:
  backend: hybrid
  enableHNSW: true
  persistPath: .claude-flow/data
  cacheSize: 100
  learningBridge:
    enabled: true
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: true
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: true
    defaultScope: project

# ── NEURAL ───────────────────────────────────────────────────
neural:
  enabled: true
  modelPath: .claude-flow/neural

# ── HOOKS ────────────────────────────────────────────────────
hooks:
  enabled: true
  autoExecute: true

# ── MCP ──────────────────────────────────────────────────────
mcp:
  autoStart: false
  port: 3001
